<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f8" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>자산관리</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f5f7f8;
      color: #14222d;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      overflow: hidden;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f5f7f8;
      z-index: 1;
    }
    #bootOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: #f5f7f8;
      z-index: 10;
      transition: opacity 0.15s ease;
    }
    #bootOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #178b72;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 6px 16px rgba(23, 139, 114, 0.25);
    }
    .boot-title {
      font-size: 19px;
      font-weight: 800;
      color: #14222d;
    }
    .boot-sub {
      font-size: 13px;
      color: #7a8792;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="bootOverlay">
    <div class="boot-mark">₩</div>
    <div class="boot-title">자산관리</div>
    <div class="boot-sub" id="bootStatus">클라우드에서 자산 데이터를 초고속으로 불러오는 중…</div>
  </div>

  <iframe id="appFrame" title="자산관리"></iframe>

  <script>
    (() => {
      const FIREBASE_DB_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app/';
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbwCBzKd6Vb2kFonZFsUsIErhU4HbX3UDB55yjrHDb-n0iJ0Nv15q6WpHkOAosyQohrp/exec';
      const CHANNEL = 'asset-manager-sheet-bridge-v1';

      const appFrame = document.getElementById('appFrame');
      const bootOverlay = document.getElementById('bootOverlay');
      const bootStatus = document.getElementById('bootStatus');

      const cleanFbUrl = String(FIREBASE_DB_URL || '').trim().replace(/\/+$/, '');

      let bridgeSource = null;
      let resolveBridgeReady = null;
      const pending = new Map();

      const bridgeReady = new Promise((resolve) => {
        resolveBridgeReady = resolve;
      });

      window.addEventListener('message', (event) => {
        let host = '';
        try { host = new URL(event.origin).hostname; } catch (_) { return; }
        const fromAppsScript = host === 'script.google.com' || (host.includes('script') && host.endsWith('googleusercontent.com'));
        if (!fromAppsScript || !event.data || event.data.channel !== CHANNEL) return;

        if (event.data.type === 'ready') {
          if (!bridgeSource) {
            bridgeSource = event.source;
            resolveBridgeReady();
          }
          return;
        }
        if (event.source !== bridgeSource) return;
        const item = pending.get(event.data.id);
        if (!item) return;
        clearTimeout(item.timer);
        pending.delete(event.data.id);
        event.data.error ? item.reject(new Error(event.data.error)) : item.resolve(event.data.result);
      });

      const bridgeFrame = document.createElement('iframe');
      bridgeFrame.title = '자산관리 시트 연결';
      bridgeFrame.setAttribute('aria-hidden', 'true');
      bridgeFrame.tabIndex = -1;
      bridgeFrame.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;border:0;opacity:0';
      bridgeFrame.src = GAS_URL;
      document.body.appendChild(bridgeFrame);

      async function readCloud(key) {
        try {
          const res = await fetch(`${cleanFbUrl}/asset/${key}.json`, { cache: 'no-store' });
          if (!res.ok) return null;
          return await res.json();
        } catch (_) {
          return null;
        }
      }

      async function writeCloud(key, data) {
        if (!data) return;
        try {
          await fetch(`${cleanFbUrl}/asset/${key}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } catch (_) {}
      }

      window.__assetSheetCall = async (action, payload) => {
        let waitTimer;
        await Promise.race([
          bridgeReady,
          new Promise((_, reject) => {
            waitTimer = setTimeout(() => reject(new Error('시트 연결이 지연되고 있어. 앱스크립트 새 버전 배포를 확인해줘.')), 15000);
          })
        ]).finally(() => clearTimeout(waitTimer));

        return new Promise((resolve, reject) => {
          const id = 'sync-' + Date.now() + '-' + Math.random().toString(36).slice(2);
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('시트 응답 시간이 초과됐어.'));
          }, 25000);
          pending.set(id, { resolve, reject, timer });
          bridgeSource.postMessage({ channel: CHANNEL, id, action, payload }, '*');
        });
      };

      window.__assetHybridCall = async (action, payload) => {
        if (action === 'read') {
          // Cached bootstrap paints quickly; editable state must come from Sheets.
          const fresh = await window.__assetSheetCall('read');
          if (!fresh || !fresh.ok) throw new Error('최신 시트 자료를 확인하지 못했어.');
          if (fresh.state) writeCloud('state', fresh);
          return fresh;
        }

        if (action === 'write') {
          const res = await window.__assetSheetCall('write', payload);
          if (res && res.ok) {
            const persisted = JSON.parse(JSON.stringify(payload || {}));
            delete persisted.resetQuarters;
            delete persisted.resetBaselines;
            delete persisted.pendingBriefings;
            writeCloud('state', {
              ok: true,
              updatedAt: res.updatedAt || Date.now(),
              state: { ...persisted, briefings: res.briefings || [] },
              briefings: res.briefings || []
            });
            // 시트 기록이 바뀌었으니 초기 스냅샷도 백그라운드 최신화
            window.__assetSheetCall('bootstrap').then((boot) => {
              if (boot && boot.data && boot.data.periodRows) writeCloud('bootstrap', boot);
            }).catch(() => {});
          }
          return res;
        }

        return window.__assetSheetCall(action, payload);
      };

      // 1순위: Firebase 클라우드에서 0.1초 만에 로드 -> 없으면 구글 시트에서 직접 생성 후 클라우드 저장!
      window.__getAssetBootstrap = async () => {
        try {
          const cached = JSON.parse(localStorage.getItem('asset-bootstrap-v1') || 'null');
          if (cached && cached.payload && cached.payload.data && cached.payload.data.periodRows) {
            readCloud('bootstrap').then((cloud) => {
              if (cloud && cloud.data && cloud.data.periodRows) {
                localStorage.setItem('asset-bootstrap-v1', JSON.stringify({ version: 'cloud-v1', payload: cloud }));
              }
            }).catch(() => {});
            return cached.payload;
          }
        } catch (_) {}

        const cloudBoot = await readCloud('bootstrap');
        if (cloudBoot && cloudBoot.data && cloudBoot.data.periodRows) {
          try { localStorage.setItem('asset-bootstrap-v1', JSON.stringify({ version: 'cloud-v1', payload: cloudBoot })); } catch (_) {}
          return cloudBoot;
        }

        // 클라우드가 비어 있으면 구글 시트 원본에서 직접 추출해 클라우드에 자동 저장
        bootStatus.textContent = '최초 1회: 구글 시트에서 기본 자산 데이터를 가져와 클라우드에 세팅 중…';
        const sheetBoot = await window.__assetSheetCall('bootstrap');
        if (sheetBoot && sheetBoot.data && sheetBoot.data.periodRows) {
          await writeCloud('bootstrap', sheetBoot);
          try { localStorage.setItem('asset-bootstrap-v1', JSON.stringify({ version: 'cloud-v1', payload: sheetBoot })); } catch (_) {}
          return sheetBoot;
        }
        throw new Error('구글 시트 연결을 확인해줘. 앱스크립트 [새 버전 배포]가 필요해.');
      };

      function injectIntoAssetApp(rawHtml, preloadedBootstrap) {
        const safeBoot = JSON.stringify(preloadedBootstrap).replace(/[<>&]/g, (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
        const closeTag = '<' + '/script>';
        const shim =
          '<script>\n' +
          '(() => {\n' +
          '  const PRELOADED = ' + safeBoot + ';\n' +
          '  try {\n' +
          '    localStorage.setItem("asset-bootstrap-v1", JSON.stringify({ version: "e974758bf3ee36c1433d", payload: PRELOADED }));\n' +
          '  } catch (_) {}\n' +
          '  const origFetch = window.fetch.bind(window);\n' +
          '  window.fetch = async (input, init) => {\n' +
          '    const url = typeof input === "string" ? input : (input && input.url ? input.url : "");\n' +
          '    if (url.includes("private-data.json")) {\n' +
          '      return new Response(JSON.stringify(PRELOADED), { status: 200, headers: { "Content-Type": "application/json" } });\n' +
          '    }\n' +
          '    return origFetch(input, init);\n' +
          '  };\n' +
          '})();\n' +
          closeTag;

        const swRe = new RegExp('<script>\\(\\(\\)=>\\{if\\(!\\(\'serviceWorker\'[\\s\\S]*?<' + '/script>', 'gi');
        const cfRe = new RegExp('<script>\\(function\\(\\)\\{function c\\(\\)[\\s\\S]*?<' + '/script>', 'gi');

        const bridgeReplace = "async function initializeSheetBridge(){\n  if(bridgeInitialized)return;\n  bridgeInitialized=true;\n  bridgeReady=false;\n  setSyncLabel(\"최신 시트 확인 중…\",\"pending\");\n  try {\n    const remote=await window.parent.__assetHybridCall(\"read\");\n    if(!remote || !remote.ok)throw new Error(\"최신 자료 확인 실패\");\n    const localDirty=Number(saved.localUpdatedAt||0)>Number(saved.syncUpdatedAt||0)\n      || Object.keys(pendingBriefings).length>0 || (saved.resetQuarters||[]).length>0\n      || (!saved.syncUpdatedAt && hasSavedEdits());\n    if(localDirty){\n      // Preserve local values and their unsynced timestamp. Never auto-upload on load.\n      saveLocal();\n      bridgeReady=true;\n      setSyncLabel(\"최신 시트 확인됨 · 기기 미저장 수정값 유지\",\"pending\");\n      toast(\"기기에 남은 수정값을 유지했어. 내용을 확인한 뒤 저장해줘.\");\n      return;\n    }\n    if(remote.state){\n      applySyncedState(remote.state,remote.updatedAt||Date.now());\n      briefingRows=mergeBriefingRows(briefingRows,window.BRIEFING_FALLBACK,remote.briefings);\n      refresh();\n    }\n    bridgeReady=true;\n    setSyncLabel(\"최신 시트 연결됨\",\"ready\");\n  }catch(err){\n    bridgeReady=false;\n    setSyncLabel(\"시트 확인 실패 · 기기 수정값 유지 · 새로고침 필요\",\"error\");\n  }\n}\n";

        let cleaned = String(rawHtml || '')
          .replace(swRe, '')
          .replace(cfRe, '')
          .replace('function bridgeCall(action,payload){', 'function bridgeCall(action,payload){ return window.parent.__assetHybridCall(action,payload); ')
          .replace('async function initializeSheetBridge(){', bridgeReplace + 'async function _unusedInitBridge(){');

        if (/<head[^>]*>/i.test(cleaned)) {
          return cleaned.replace(/<head[^>]*>/i, (m) => m + shim);
        }
        return shim + cleaned;
      }

      async function loadAppShell() {
        const candidates = ['./app.html', './자산관리%20site%20html%20소스.txt'];
        let appHtmlText = '';
        for (const path of candidates) {
          try {
            const res = await fetch(path);
            if (res.ok) {
              const text = await res.text();
              if (text.includes('asset-generic-shell-v1') || text.includes('자산관리')) {
                appHtmlText = text;
                break;
              }
            }
          } catch (_) {}
        }

        if (!appHtmlText) {
          bootStatus.innerHTML = '깃허브 저장소에 <b>app.html</b> 파일을 함께 올려주세요.';
          return;
        }

        try {
          const bootstrapPayload = await window.__getAssetBootstrap();
          appFrame.onload = () => bootOverlay.classList.add('hidden');
          appFrame.srcdoc = injectIntoAssetApp(appHtmlText, bootstrapPayload);
          setTimeout(() => bootOverlay.classList.add('hidden'), 200);
        } catch (err) {
          bootStatus.innerHTML = '기본 자산 데이터를 불러오지 못했습니다.<br>' + (err && err.message ? err.message : String(err));
        }
      }

      loadAppShell();
    })();
  </script>
</body>
</html>
