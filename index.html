<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f8" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>자산관리</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f5f7f8;
      color: #14222d;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      overflow: hidden;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f5f7f8;
      z-index: 1;
    }
    #bootOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: #f5f7f8;
      z-index: 10;
      transition: opacity 0.15s ease;
    }
    #bootOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #178b72;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 6px 16px rgba(23, 139, 114, 0.25);
    }
    .boot-title {
      font-size: 19px;
      font-weight: 800;
      color: #14222d;
    }
    .boot-sub {
      font-size: 13px;
      color: #7a8792;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="bootOverlay">
    <div class="boot-mark">₩</div>
    <div class="boot-title">자산관리</div>
    <div class="boot-sub" id="bootStatus">클라우드에서 자산 데이터를 초고속으로 불러오는 중…</div>
  </div>

  <iframe id="appFrame" title="자산관리"></iframe>

  <script>
    (() => {
      // 비밀번호 잠금을 사용하려면 따옴표 안에 원하는 비밀번호를 넣으세요 (예: '1234', 비워두면 바로 열림)
      const APP_PIN = '';

      const FIREBASE_DB_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app';
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbwCBzKd6Vb2kFonZFsUsIErhU4HbX3UDB55yjrHDb-n0iJ0Nv15q6WpHkOAosyQohrp/exec';
      const CHANNEL = 'asset-manager-sheet-bridge-v1';
      const BOOT_CACHE_KEY = 'asset-bootstrap-v1';
      const APP_BOOT_VERSION = 'e974758bf3ee36c1433d';

      const appFrame = document.getElementById('appFrame');
      const bootOverlay = document.getElementById('bootOverlay');
      const bootStatus = document.getElementById('bootStatus');
      const cleanFbUrl = String(FIREBASE_DB_URL || '').trim().replace(/\/+$/, '');

      if (APP_PIN) {
        const savedPin = sessionStorage.getItem('asset_pin_ok');
        if (savedPin !== APP_PIN) {
          const input = prompt('자산관리 비밀번호(PIN)를 입력하세요:');
          if (input !== APP_PIN) {
            bootStatus.innerHTML = '비밀번호가 일치하지 않습니다.<br>새로고침하여 다시 입력해 주세요.';
            return;
          }
          sessionStorage.setItem('asset_pin_ok', APP_PIN);
        }
      }

      // Firebase가 객체({"0":...})로 변환한 데이터를 정상 배열로 복원
      function toArray(val) {
        if (!val) return [];
        if (Array.isArray(val)) return val;
        if (typeof val === 'object') {
          const keys = Object.keys(val).map(Number).filter(Number.isFinite);
          if (!keys.length) return [];
          const len = Math.max(...keys) + 1;
          return Array.from({ length: len }, (_, i) => (val[i] === undefined ? '' : val[i]));
        }
        return [];
      }

      function to2DArray(table, minWidth = 0) {
        const rows = toArray(table).filter(r => r != null);
        return rows.map(r => {
          const arr = toArray(r);
          const width = Math.max(minWidth, arr.length);
          return Array.from({ length: width }, (_, i) => (arr[i] == null ? '' : String(arr[i])));
        });
      }

      function normalizeBootstrap(raw) {
        if (!raw || typeof raw !== 'object' || !raw.data) return null;
        return {
          ...raw,
          ok: true,
          data: {
            source: raw.data.source || '자산관리_초안',
            importedThrough: raw.data.importedThrough || '2026Q3',
            periodRows: to2DArray(raw.data.periodRows, 14),
            balanceRows: to2DArray(raw.data.balanceRows, 10),
            targetRows: to2DArray(raw.data.targetRows, 13)
          },
          briefings: toArray(raw.briefings).filter(Boolean)
        };
      }

      function normalizeStateRecord(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const st = (raw.state && typeof raw.state === 'object') ? raw.state : {};
        const briefings = toArray(raw.briefings || st.briefings).filter(Boolean);
        return {
          ...raw,
          ok: true,
          updatedAt: Number(raw.updatedAt) || Date.now(),
          state: {
            ...st,
            actualsByYear: (st.actualsByYear && typeof st.actualsByYear === 'object') ? st.actualsByYear : {},
            deletedGoalYears: toArray(st.deletedGoalYears).filter(Boolean),
            periods: (st.periods && typeof st.periods === 'object') ? st.periods : {},
            goalsByYear: (st.goalsByYear && typeof st.goalsByYear === 'object') ? st.goalsByYear : {},
            records: (st.records && typeof st.records === 'object') ? st.records : {},
            briefings
          },
          briefings
        };
      }

      function dedupeBriefings(list) {
        const seen = new Set();
        const out = [];
        for (const item of toArray(list)) {
          if (!item || typeof item !== 'object') continue;
          const key = String(item.id || `${item.quarter || ''}|${item.createdAt || item.date || ''}|${item.title || ''}`);
          if (seen.has(key)) continue;
          seen.add(key);
          out.push(item);
        }
        return out;
      }

      // 1. 페이지 시작 즉시 app.html, bootstrap.json, state.json 3가지를 동시에 병렬 프리패치!
      let cachedBoot = null;
      let cachedState = null;
      let latestWriteSeq = 0;

      const prefetchShellPromise = fetch('./app.html')
        .then(r => (r.ok ? r.text() : null))
        .catch(() => null);

      const prefetchBootPromise = fetch(`${cleanFbUrl}/asset/bootstrap.json`, { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          const norm = normalizeBootstrap(d);
          if (norm && norm.data.periodRows.length) cachedBoot = norm;
          return cachedBoot;
        })
        .catch(() => null);

      const prefetchStatePromise = fetch(`${cleanFbUrl}/asset/state.json`, { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          const norm = normalizeStateRecord(d);
          if (norm) cachedState = norm;
          return cachedState;
        })
        .catch(() => null);

      // 2. 구글 시트 백그라운드 백업용 숨김 브리지
      let bridgeSource = null;
      let resolveBridgeReady = null;
      const pending = new Map();
      const bridgeReady = new Promise(resolve => { resolveBridgeReady = resolve; });

      window.addEventListener('message', (event) => {
        let host = '';
        try { host = new URL(event.origin).hostname; } catch (_) { return; }
        const fromAppsScript = host === 'script.google.com' || (host.includes('script') && host.endsWith('googleusercontent.com'));
        if (!fromAppsScript || !event.data || event.data.channel !== CHANNEL) return;

        if (event.data.type === 'ready') {
          if (!bridgeSource) {
            bridgeSource = event.source;
            resolveBridgeReady();
          }
          return;
        }
        if (event.source !== bridgeSource) return;
        const item = pending.get(event.data.id);
        if (!item) return;
        clearTimeout(item.timer);
        pending.delete(event.data.id);
        event.data.error ? item.reject(new Error(event.data.error)) : item.resolve(event.data.result);
      });

      const bridgeFrame = document.createElement('iframe');
      bridgeFrame.title = '자산관리 시트 백업 연결';
      bridgeFrame.setAttribute('aria-hidden', 'true');
      bridgeFrame.tabIndex = -1;
      bridgeFrame.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;border:0;opacity:0';
      bridgeFrame.src = GAS_URL + '?bridge=1';
      document.body.appendChild(bridgeFrame);

      async function writeCloud(key, data) {
        if (!data) return false;
        try {
          const res = await fetch(`${cleanFbUrl}/asset/${key}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          return res.ok;
        } catch (_) {
          return false;
        }
      }

      window.__assetSheetCall = async (action, payload) => {
        let waitTimer;
        await Promise.race([
          bridgeReady,
          new Promise((_, reject) => {
            waitTimer = setTimeout(() => reject(new Error('시트 백업 연결 대기 초과')), 15000);
          })
        ]).finally(() => clearTimeout(waitTimer));

        return new Promise((resolve, reject) => {
          const id = 'sync-' + Date.now() + '-' + Math.random().toString(36).slice(2);
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('시트 백업 응답 시간 초과'));
          }, 25000);
          pending.set(id, { resolve, reject, timer });
          bridgeSource.postMessage({ channel: CHANNEL, id, action, payload }, '*');
        });
      };

      // 미백업 데이터가 남아있을 때 시트 연결 즉시 백그라운드 자동 백업
      function flushPendingBackupToSheet(cloudState) {
        if (!cloudState || !cloudState.needsSheetBackup || !cloudState.unsyncedPayload) return;
        const mySeq = latestWriteSeq;
        window.__assetSheetCall('write', cloudState.unsyncedPayload)
          .then(sheetRes => {
            if (mySeq !== latestWriteSeq) return;
            const cleaned = normalizeStateRecord({
              ...cloudState,
              needsSheetBackup: false,
              unsyncedPayload: null,
              briefings: (sheetRes && Array.isArray(sheetRes.briefings) && sheetRes.briefings.length)
                ? dedupeBriefings([...sheetRes.briefings, ...(cloudState.briefings || [])])
                : cloudState.briefings
            });
            cachedState = cleaned;
            writeCloud('state', cleaned);
          })
          .catch(() => {});
      }

      // 3. 클라우드 메인 처리 + 구글 시트 백그라운드 백업 라우터
      window.__assetHybridCall = async (action, payload) => {
        if (action === 'read') {
          const cloudState = cachedState || (await prefetchStatePromise);
          if (cloudState && cloudState.ok) {
            if (cloudState.needsSheetBackup) {
              flushPendingBackupToSheet(cloudState);
            }
            return cloudState;
          }
          const sheetState = normalizeStateRecord(await window.__assetSheetCall('read'));
          if (sheetState && sheetState.ok) {
            cachedState = sheetState;
            await writeCloud('state', sheetState);
          }
          return sheetState;
        }

        if (action === 'write') {
          const mySeq = ++latestWriteSeq;
          const now = Date.now();
          const prevCloud = cachedState || (await prefetchStatePromise) || {};
          const prevBriefings = toArray(prevCloud.briefings || prevCloud.state?.briefings);

          const rawPayloadCopy = JSON.parse(JSON.stringify(payload || {}));
          const persisted = JSON.parse(JSON.stringify(payload || {}));
          const pendingBriefings = toArray(persisted.pendingBriefings);
          delete persisted.resetQuarters;
          delete persisted.resetBaselines;
          delete persisted.pendingBriefings;

          const mergedBriefings = dedupeBriefings([...pendingBriefings, ...prevBriefings]);
          const newCloudRecord = normalizeStateRecord({
            ok: true,
            updatedAt: now,
            needsSheetBackup: true,
            unsyncedPayload: rawPayloadCopy,
            state: { ...persisted, briefings: mergedBriefings },
            briefings: mergedBriefings
          });

          // 1) Firebase 클라우드에 0.1초 만에 즉시 저장 완료 처리
          cachedState = newCloudRecord;
          const saved = await writeCloud('state', newCloudRecord);
          if (!saved) {
            throw new Error('Firebase 클라우드 저장에 실패했어. 네트워크를 확인해줘.');
          }

          // 2) 구글 시트에는 백그라운드로 조용히 백업 + 시트 수식 재계산 결과(bootstrap)도 클라우드에 반영
          window.__assetSheetCall('write', rawPayloadCopy)
            .then(sheetRes => {
              if (mySeq !== latestWriteSeq) return;
              const syncedBriefings = (sheetRes && Array.isArray(sheetRes.briefings) && sheetRes.briefings.length)
                ? dedupeBriefings([...sheetRes.briefings, ...mergedBriefings])
                : mergedBriefings;
              const finalized = normalizeStateRecord({
                ok: true,
                updatedAt: Date.now(),
                needsSheetBackup: false,
                unsyncedPayload: null,
                state: { ...persisted, briefings: syncedBriefings },
                briefings: syncedBriefings
              });
              cachedState = finalized;
              writeCloud('state', finalized);

              window.__assetSheetCall('bootstrap')
                .then(boot => {
                  const normBoot = normalizeBootstrap(boot);
                  if (normBoot && normBoot.data.periodRows.length) {
                    cachedBoot = normBoot;
                    writeCloud('bootstrap', normBoot);
                    try { localStorage.setItem(BOOT_CACHE_KEY, JSON.stringify({ version: APP_BOOT_VERSION, payload: normBoot })); } catch (_) {}
                  }
                })
                .catch(() => {});
            })
            .catch(err => {
              console.warn('구글 시트 백그라운드 백업 대기 중:', err);
            });

          return newCloudRecord;
        }

        // 텔레그램 브리핑 전송 등 특수 작업은 앱스크립트로 실행
        return window.__assetSheetCall(action, payload);
      };

      window.__getAssetBootstrap = async () => {
        const cloudBoot = cachedBoot || (await prefetchBootPromise);
        if (cloudBoot && cloudBoot.data && cloudBoot.data.periodRows.length) {
          try { localStorage.setItem(BOOT_CACHE_KEY, JSON.stringify({ version: APP_BOOT_VERSION, payload: cloudBoot })); } catch (_) {}
          return cloudBoot;
        }

        try {
          const cached = JSON.parse(localStorage.getItem(BOOT_CACHE_KEY) || 'null');
          const normCached = normalizeBootstrap(cached?.payload);
          if (normCached && normCached.data.periodRows.length) {
            return normCached;
          }
        } catch (_) {}

        bootStatus.textContent = '최초 1회: 구글 시트에서 기본 자산 데이터를 가져와 클라우드에 세팅 중…';
        const sheetBoot = normalizeBootstrap(await window.__assetSheetCall('bootstrap'));
        if (sheetBoot && sheetBoot.data.periodRows.length) {
          cachedBoot = sheetBoot;
          await writeCloud('bootstrap', sheetBoot);
          try { localStorage.setItem(BOOT_CACHE_KEY, JSON.stringify({ version: APP_BOOT_VERSION, payload: sheetBoot })); } catch (_) {}
          return sheetBoot;
        }
        throw new Error('Firebase 클라우드 및 시트 연결을 확인해줘.');
      };

      function injectIntoAssetApp(rawHtml, preloadedBootstrap) {
        const safeBoot = JSON.stringify(preloadedBootstrap).replace(/[<>&]/g, (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
        const closeTag = '<' + '/script>';
        const shim =
          '<script>\n' +
          '(() => {\n' +
          '  const PRELOADED = ' + safeBoot + ';\n' +
          '  try {\n' +
          '    localStorage.setItem("asset-bootstrap-v1", JSON.stringify({ version: "e974758bf3ee36c1433d", payload: PRELOADED }));\n' +
          '  } catch (_) {}\n' +
          '  const origFetch = window.fetch.bind(window);\n' +
          '  window.fetch = async (input, init) => {\n' +
          '    const url = typeof input === "string" ? input : (input && input.url ? input.url : "");\n' +
          '    if (url.includes("private-data.json")) {\n' +
          '      return new Response(JSON.stringify(PRELOADED), { status: 200, headers: { "Content-Type": "application/json" } });\n' +
          '    }\n' +
          '    return origFetch(input, init);\n' +
          '  };\n' +
          '})();\n' +
          closeTag;

        const swRe = new RegExp('<script>\\(\\(\\)=>\\{if\\(!\\(\'serviceWorker\'[\\s\\S]*?<' + '/script>', 'gi');
        const cfRe = new RegExp('<script>\\(function\\(\\)\\{function c\\(\\)[\\s\\S]*?<' + '/script>', 'gi');

        const bridgeReplace =
          'async function initializeSheetBridge(){\n' +
          '  if(bridgeInitialized)return;\n' +
          '  bridgeInitialized=true;\n' +
          '  bridgeReady=true;\n' +
          '  setSyncLabel("클라우드 확인 중…","pending");\n' +
          '  try {\n' +
          '    const remote = await window.parent.__assetHybridCall("read");\n' +
          '    if(remote && remote.ok && remote.state){\n' +
          '      applySyncedState(remote.state, Math.max(Number(remote.updatedAt) || 0, Date.now() + 1000));\n' +
          '      briefingRows = mergeBriefingRows(briefingRows, window.BRIEFING_FALLBACK, remote.briefings);\n' +
          '      refresh();\n' +
          '      setSyncLabel("클라우드 연결됨 · 시트 자동 백업","ready");\n' +
          '    } else {\n' +
          '      setSyncLabel("기본 자료 표시 중","pending");\n' +
          '    }\n' +
          '  } catch (err) {\n' +
          '    setSyncLabel("저장된 자료 표시 중","pending");\n' +
          '  }\n' +
          '}\n';

        let cleaned = String(rawHtml || '')
          .replace(swRe, '')
          .replace(cfRe, '')
          .replace('function bridgeCall(action,payload){', 'function bridgeCall(action,payload){ return window.parent.__assetHybridCall(action,payload); ')
          .replace('async function initializeSheetBridge(){', bridgeReplace + 'async function _unusedInitBridge(){');

        if (/<head[^>]*>/i.test(cleaned)) {
          return cleaned.replace(/<head[^>]*>/i, (m) => m + shim);
        }
        return shim + cleaned;
      }

      async function boot() {
        let appHtmlText = await prefetchShellPromise;
        if (!appHtmlText) {
          try {
            const res = await fetch('./자산관리%20site%20html%20소스.txt');
            if (res.ok) appHtmlText = await res.text();
          } catch (_) {}
        }

        if (!appHtmlText || (!appHtmlText.includes('asset-generic-shell-v1') && !appHtmlText.includes('자산관리'))) {
          bootStatus.innerHTML = '깃허브 저장소에 <b>app.html</b> 파일을 확인해 주세요.';
          return;
        }

        try {
          const bootstrapPayload = await window.__getAssetBootstrap();
          await prefetchStatePromise;
          appFrame.onload = () => bootOverlay.classList.add('hidden');
          appFrame.srcdoc = injectIntoAssetApp(appHtmlText, bootstrapPayload);
          setTimeout(() => bootOverlay.classList.add('hidden'), 150);
        } catch (err) {
          bootStatus.innerHTML = '기본 자산 데이터를 불러오지 못했습니다.<br>' + (err && err.message ? err.message : String(err));
        }
      }

      boot();
    })();
  </script>
</body>
</html>
